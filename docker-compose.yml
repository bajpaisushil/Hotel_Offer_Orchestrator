services:
  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/temporal:latest
    container_name: hotel-temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0"]
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
      - "${TEMPORAL_UI_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: hotel-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      SUPPLIER_A_URL: http://api:3000/supplierA/hotels
      SUPPLIER_B_URL: http://api:3000/supplierB/hotels
      SUPPLIER_A_FORCE_DOWN: ${SUPPLIER_A_FORCE_DOWN:-false}
      SUPPLIER_B_FORCE_DOWN: ${SUPPLIER_B_FORCE_DOWN:-false}
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: hotel-offers
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    container_name: hotel-worker
    command: ["node", "dist/temporal/worker.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      SUPPLIER_A_URL: http://api:3000/supplierA/hotels
      SUPPLIER_B_URL: http://api:3000/supplierB/hotels
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: hotel-offers
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
